<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#08225c"/>
      <stop offset="60%" stop-color="#030a18"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <!-- Keyring -->
    <circle cx="300" cy="112" r="32" stroke="#a6c8ff" stroke-width="6"/>
    <line x1="300" y1="144" x2="300" y2="176" stroke="#a6c8ff" stroke-width="5"/>
    <!-- Isometric 3D JF Cube Keychain -->
    <polygon points="300,168 402,226 300,284 198,226" fill="#06122b" stroke="#0066ff" stroke-width="4"/>
    <polygon points="198,226 300,284 300,382 198,324" fill="#040b1d" stroke="#0066ff" stroke-width="4"/>
    <polygon points="402,226 300,284 300,382 402,324" fill="#071738" stroke="#4db3ff" stroke-width="4"/>
    <text x="300" y="240" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="900">3D</text>
    <text x="248" y="325" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="42" font-weight="900">J</text>
    <text x="352" y="325" text-anchor="middle" fill="#5cc8ff" font-family="Montserrat, Arial, sans-serif" font-size="42" font-weight="900">F</text>
  </g>
  <text x="30" y="42" fill="#5cc8ff" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" opacity="0.85">JULIFOR3D · LLAVERO PERSONALIZADO</text>
</svg>
