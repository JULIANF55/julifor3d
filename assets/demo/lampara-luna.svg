<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#0d2c70"/>
      <stop offset="55%" stop-color="#040b1c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#a8dcff"/>
      <stop offset="85%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#002b80"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="205" r="118" fill="#0066ff" opacity="0.32" filter="url(#glow)"/>
  <circle cx="300" cy="205" r="102" fill="url(#moon)" stroke="#cfefff" stroke-width="2"/>
  <!-- Lithophane craters -->
  <circle cx="268" cy="172" r="22" fill="#0044b3" opacity="0.22"/>
  <circle cx="332" cy="186" r="15" fill="#0044b3" opacity="0.26"/>
  <circle cx="290" cy="240" r="26" fill="#003b99" opacity="0.2"/>
  <circle cx="342" cy="235" r="11" fill="#0044b3" opacity="0.28"/>
  <circle cx="250" cy="222" r="10" fill="#0044b3" opacity="0.25"/>
  <!-- Minimalist geometric stand -->
  <path d="M235 300 L262 365 L338 365 L365 300" stroke="#0066ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M248 332 L352 332" stroke="#5cc8ff" stroke-width="3"/>
  <ellipse cx="300" cy="372" rx="95" ry="12" fill="#0066ff" opacity="0.28"/>
  <text x="30" y="42" fill="#5cc8ff" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" opacity="0.85">JULIFOR3D · LITOFANÍA &amp; LUZ LED</text>
