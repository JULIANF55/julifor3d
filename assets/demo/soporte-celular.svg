<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#071e4f"/>
      <stop offset="60%" stop-color="#030a19"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="dock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2b4a"/>
      <stop offset="100%" stop-color="#060c1a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <ellipse cx="300" cy="365" rx="180" ry="24" fill="#0066ff" opacity="0.22" filter="url(#glow)"/>
  <!-- Modular desk organizer & phone stand -->
  <g filter="url(#glow)">
    <!-- Base platform -->
    <path d="M135 320 L225 270 L465 270 L395 345 L135 345 Z" fill="url(#dock)" stroke="#0066ff" stroke-width="2.5"/>
    <!-- Angled phone holder -->
    <path d="M195 305 L235 120 L345 120 L305 305 Z" fill="#071126" stroke="#4db3ff" stroke-width="3"/>
    <rect x="234" y="142" width="76" height="130" rx="10" transform="skewX(-12)" fill="#030814" stroke="#0066ff" stroke-width="2"/>
    <line x1="255" y1="292" x2="295" y2="292" stroke="#5cc8ff" stroke-width="3" stroke-linecap="round"/>
    <!-- Watch / cable spool + pen tray -->
    <rect x="348" y="210" width="84" height="95" rx="8" fill="#09152e" stroke="#0066ff" stroke-width="2.5"/>
    <line x1="364" y1="235" x2="416" y2="235" stroke="#5cc8ff" stroke-width="2"/>
    <line x1="364" y1="255" x2="416" y2="255" stroke="#0066ff" stroke-width="2"/>
    <line x1="364" y1="275" x2="416" y2="275" stroke="#0066ff" stroke-width="2"/>
  </g>
  <text x="30" y="42" fill="#5cc8ff" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" opacity="0.85">JULIFOR3D · SETUP &amp; ESCRITORIO</text>
</svg>
