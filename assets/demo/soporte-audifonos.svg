<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#071f54"/>
      <stop offset="60%" stop-color="#030a18"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <ellipse cx="300" cy="378" rx="145" ry="20" fill="#0066ff" opacity="0.25" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <!-- Hexagonal base -->
    <polygon points="300,330 395,355 370,382 230,382 205,355" fill="#09152e" stroke="#0066ff" stroke-width="2.5"/>
    <!-- Vertical geometric pillar -->
    <path d="M282 348 L288 128 L312 128 L318 348 Z" fill="#0b1a3b" stroke="#4db3ff" stroke-width="2.5"/>
    <!-- Top curved cradle -->
    <path d="M245 142 Q300 95 355 142" stroke="#0066ff" stroke-width="14" stroke-linecap="round"/>
    <path d="M245 142 Q300 95 355 142" stroke="#80d4ff" stroke-width="3" stroke-linecap="round"/>
    <!-- Stylized headphones outline resting -->
    <path d="M225 225 C225 135, 375 135, 375 225" stroke="#ffffff" stroke-width="5" opacity="0.88"/>
    <rect x="206" y="210" width="34" height="68" rx="14" fill="#040d21" stroke="#5cc8ff" stroke-width="3"/>
    <rect x="360" y="210" width="34" height="68" rx="14" fill="#040d21" stroke="#5cc8ff" stroke-width="3"/>
    <!-- JF emblem on base -->
    <text x="300" y="366" text-anchor="middle" fill="#5cc8ff" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2">JF3D</text>
  </g>
  <text x="30" y="42" fill="#5cc8ff" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" opacity="0.85">JULIFOR3D · SOPORTE GAMER</text>
</svg>
