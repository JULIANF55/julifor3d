      <stop offset="0%" stop-color="#071d4d"/>
      <stop offset="55%" stop-color="#030a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5cc8ff"/>
