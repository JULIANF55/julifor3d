    <path d="M225 290 Q300 275 365 292" stroke="#a6e1ff" stroke-width="1.2" opacity="0.55"/>
    <path d="M220 320 Q300 308 380 322" stroke="#a6e1ff" stroke-width="1.2" opacity="0.5"/>
