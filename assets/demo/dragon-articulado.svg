  <ellipse cx="300" cy="365" rx="130" ry="18" stroke="#0066ff" stroke-width="1.5" fill="#040d21"/>
  <!-- Stylized articulated low-poly 3D dragon figure -->
  <g filter="url(#glow)">
    <path d="M210 350 C175 310, 175 245, 225 220 C240 165, 290 120, 345 125 L395 95 L385 135 L425 148 L385 170 C395 215, 370 265, 330 285 C355 305, 395 315, 435 335 C380 365, 270 368, 210 350 Z" fill="url(#neon)" stroke="#7fd4ff" stroke-width="2.5"/>
